<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: file:; connect-src 'self' https://soysfbirinxmkivenvnp.supabase.co wss://soysfbirinxmkivenvnp.supabase.co https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">

<title>UTravel | Your Choice. Your Journey. – احجز رحلتك في مصر</title>
<meta name="description" content="UTravel: منصة تجمع شركات السياحة المصرية في مكان واحد. قارن الرحلات واحجز مقعدك وادفع أونلاين.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="assets/brand/utravel-symbol.svg">
<style>
:root{
  /* UTravel brand tokens — Color Palette: Primary Deep Blue #1E3F5B · Secondary Soft Blue #6F9EC6 ·
     Luxury Gold #C8A96E · Background Cream #F7F5F0 · Deep Charcoal Navy #23303D.
     The *-700 shades are the AA-contrast versions used for text and filled buttons. */
  --navy-950:#141F2A; --navy-900:#1A2E40; --navy:#1E3F5B; --navy-700:#2B5478; --navy-100:#E6EDF3;
  --teal:#6F9EC6; --teal-700:#3D6C93; --teal-50:#EAF2F9;
  --sand:#C8A96E; --sand-700:#7E602A; --sand-50:#F6EFE1;
  --bg:#F7F5F0; --surface:#FFFFFF; --ink:#23303D; --muted:#5D6975; --faint:#646E78; --line:#E5E0D6; --line-2:#EFEBE3;
  --ok:#2C7560; --ok-50:#E6F0ED; --warn:#8F6420; --warn-50:#F6EEDD; --bad:#A8443F; --bad-50:#F8E9E7; --info:#3D6C93; --info-50:#E9F1F4;
  --f-brand:"Marcellus","Cormorant Garamond",Georgia,"Times New Roman",serif;
  --r-sm:8px; --r:12px; --r-lg:18px; --r-xl:26px;
  --sh-1:0 1px 2px rgba(30,63,91,.06),0 1px 1px rgba(30,63,91,.04);
  --sh-2:0 6px 18px -6px rgba(30,63,91,.16),0 2px 6px -2px rgba(30,63,91,.08);
  --sh-3:0 24px 48px -16px rgba(20,31,42,.28);
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-disp:"Alexandria","IBM Plex Sans Arabic",system-ui,sans-serif;
  --wrap:1240px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15.5px/1.7 var(--f-body);-webkit-font-smoothing:antialiased}
[dir=ltr] body{font-size:15px}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--f-disp);color:var(--navy);margin:0;line-height:1.3;font-weight:700;letter-spacing:-.005em}
h1{font-size:clamp(28px,4.2vw,48px);font-weight:800}
h2{font-size:clamp(22px,2.6vw,30px)}
h3{font-size:18px}
h4{font-size:15.5px}
p{margin:0}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13.5px} .xs{font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:6px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hide{display:none!important}
.row{display:flex;gap:12px;align-items:center}
.row.wrapx{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1}
.stack>*+*{margin-top:12px}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:980px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:var(--r);border:1px solid transparent;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,box-shadow .15s,transform .05s;font-size:15px}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{background:var(--navy-700)}
.btn-teal{background:var(--teal);color:#fff}
.btn-teal:hover{background:var(--teal-700)}
.btn-sand{background:var(--sand);color:var(--navy-950)}
.btn-sand:hover{background:#dfa95c}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--navy)}
.btn-ghost:hover{background:var(--navy-100);border-color:var(--navy-100)}
.btn-soft{background:var(--navy-100);color:var(--navy)}
.btn-soft:hover{background:#d9e4ee}
.btn-danger{background:var(--bad);color:#fff}
.btn-danger-soft{background:var(--bad-50);color:var(--bad)}
.btn-ok-soft{background:var(--ok-50);color:var(--ok)}
.btn-sm{height:34px;padding:0 12px;font-size:13.5px;border-radius:9px}
.btn-lg{height:52px;padding:0 26px;font-size:16px}
.btn-block{width:100%}
.btn-link{background:none;border:0;color:var(--teal-700);font-weight:600;cursor:pointer;padding:0}
.btn-link:hover{text-decoration:underline}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;display:inline-grid;place-items:center;cursor:pointer;position:relative;color:var(--navy)}
.icon-btn:hover{background:var(--navy-100)}
.spin{width:18px;height:18px;border:2.5px solid currentColor;border-inline-end-color:transparent;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.lg{width:22px;height:22px}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-weight:600;font-size:13.5px;color:var(--navy)}
.input,.select,.textarea{width:100%;height:44px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:0 12px;outline:none;transition:border-color .15s,box-shadow .15s}
.textarea{height:auto;min-height:96px;padding:10px 12px;resize:vertical;line-height:1.6}
.input:focus,.select:focus,.textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(111,158,198,.18)}
.field.err .input,.field.err .select,.field.err .textarea{border-color:var(--bad);box-shadow:0 0 0 3px rgba(180,35,24,.1)}
.err-msg{color:var(--bad);font-size:12.5px;display:none}
.field.err .err-msg{display:block}
.hint{font-size:12.5px;color:var(--faint)}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:14.5px}
.check input{width:18px;height:18px;margin-top:4px;accent-color:var(--teal);flex:none}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.form-grid .full{grid-column:1/-1}
@media (max-width:640px){.form-grid{grid-template-columns:1fr}}
.seg{display:inline-flex;background:var(--line-2);border-radius:11px;padding:4px;gap:2px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted);font-size:14px}
.seg button.on{background:#fff;color:var(--navy);box-shadow:var(--sh-1)}

/* chips, badges */
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13.5px;font-weight:500;color:var(--ink);cursor:pointer}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:6px;font-size:12.5px;font-weight:600;line-height:1.7;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.b-ok{background:var(--ok-50);color:var(--ok)}
.b-warn{background:var(--warn-50);color:var(--warn)}
.b-bad{background:var(--bad-50);color:var(--bad)}
.b-info{background:var(--info-50);color:var(--info)}
.b-mute{background:var(--line-2);color:var(--muted)}
.b-teal{background:var(--teal-50);color:var(--teal-700)}
.stars{display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--navy)}
.stars svg{width:15px;height:15px;fill:var(--sand);stroke:none}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1)}
.card-pad{padding:20px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-2)}
.card-h h3{font-size:16.5px}

/* header */
.site-h{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.site-h .wrap{display:flex;align-items:center;gap:18px;height:68px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-disp);font-weight:800;font-size:22px;color:var(--navy)}
.logo-mark{width:36px;height:36px;border-radius:11px;background:var(--navy);display:grid;place-items:center}
.nav{display:flex;gap:4px;margin-inline-start:12px}
.nav a{padding:8px 12px;border-radius:9px;font-weight:500;color:var(--muted)}
.nav a:hover{color:var(--navy);background:var(--line-2)}
.nav a.on{color:var(--navy);font-weight:600}
.h-actions{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.lang-btn{height:36px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:600;cursor:pointer;font-size:13.5px}
.dot{position:absolute;top:6px;inset-inline-end:6px;min-width:16px;height:16px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;line-height:1}
.burger{display:none}
@media (max-width:900px){.nav{display:none}.burger{display:inline-grid}.h-actions .hide-m{display:none}}
.m-nav{position:fixed;inset:68px 0 auto 0;background:#fff;border-bottom:1px solid var(--line);padding:10px 20px 18px;z-index:39;box-shadow:var(--sh-2)}
.m-nav a{display:block;padding:12px 4px;border-bottom:1px solid var(--line-2);font-weight:600}

.user-menu{position:relative}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--sand);color:var(--navy-950);display:grid;place-items:center;font-weight:700;font-family:var(--f-disp);font-size:14px;flex:none}
.avatar.lg{width:56px;height:56px;font-size:20px}
.menu{position:absolute;inset-inline-end:0;top:calc(100% + 8px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-3);min-width:220px;padding:6px;z-index:60}
.menu a,.menu button{display:flex;width:100%;gap:10px;align-items:center;padding:9px 10px;border-radius:9px;border:0;background:none;cursor:pointer;text-align:start;font-size:14.5px}
.menu a:hover,.menu button:hover{background:var(--line-2)}

/* hero */
.hero{position:relative;color:#fff;overflow:hidden;background:var(--navy-950)}
.hero-art{position:absolute;inset:0}
.hero-art img{width:100%;height:100%;object-fit:cover;object-position:60% 40%}
.hero-art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,31,42,.10) 0%,rgba(20,31,42,.42) 40%,rgba(20,31,42,.9) 100%)}
.hero h1,.hero p.lead{text-shadow:0 2px 18px rgba(20,31,42,.55)}
.hero-in{position:relative;padding-block:96px 40px;min-height:560px;display:flex;flex-direction:column;justify-content:flex-end}
.hero h1{color:#fff;max-width:760px;font-size:clamp(32px,5vw,58px)}
.hero p.lead{color:#D6E2EC;font-size:18px;max-width:560px;margin-top:14px}
.hero-dest{position:absolute;top:24px;inset-inline-end:0;font-size:13px;color:#D6E2EC;background:rgba(20,31,42,.45);padding:6px 12px;border-radius:999px;backdrop-filter:blur(6px)}

/* ticket search */
.ticket{display:grid;grid-template-columns:1.1fr 1.6fr 1.1fr auto;background:#fff;color:var(--ink);border-radius:20px;box-shadow:var(--sh-3);margin-top:32px;position:relative}
.ticket .tf{padding:14px 20px;display:flex;flex-direction:column;gap:2px;position:relative;min-width:0}
.ticket .tf+.tf{border-inline-start:2px dashed var(--line)}
.ticket .tf label{font-size:12.5px;font-weight:600;color:var(--muted)}
.ticket .tf input,.ticket .tf select{border:0;outline:none;background:none;font-weight:600;font-size:16px;color:var(--navy);padding:4px 0;width:100%;min-width:0}
.ticket .tf:focus-within{background:var(--line-2)}
.ticket .tf:first-child:focus-within{border-start-start-radius:20px;border-end-start-radius:20px}
.ticket .go{display:flex;align-items:center;padding:12px;border-inline-start:2px dashed var(--line);position:relative}
.ticket .go::before,.ticket .go::after{content:"";position:absolute;inset-inline-start:-11px;width:20px;height:20px;border-radius:50%;background:var(--navy-950)}
.ticket .go::before{top:-10px}.ticket .go::after{bottom:-10px}
.price-pair{display:flex;gap:6px;align-items:center}
.price-pair input{width:50%!important}
.date-pair input{font-size:15px!important}
.date-pair .sep{color:var(--faint);flex:none}
@media (max-width:900px){.ticket{grid-template-columns:1fr 1fr}.ticket .tf+.tf{border-inline-start:0}.ticket .tf{border-bottom:2px dashed var(--line)}.ticket .tf:nth-child(2){border-inline-start:2px dashed var(--line)}.ticket .go{grid-column:1/-1;border:0}.ticket .go::before,.ticket .go::after{display:none}.ticket .go .btn{width:100%}}
@media (max-width:560px){.ticket{grid-template-columns:1fr}.ticket .tf:nth-child(2){border-inline-start:0}}
.hero-plan{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px;color:#D6E2EC;font-size:14px}
.hero-plan-link{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(200,169,110,.18);border:1px solid var(--sand);color:#fff;font-weight:700}
.hero-plan-link:hover{background:rgba(200,169,110,.3)}
.hero-stats{display:flex;gap:28px;margin-top:26px;flex-wrap:wrap;color:#D6E2EC;font-size:14px}
.hero-stats b{color:#fff;font-family:var(--f-disp);font-size:20px;display:block}

/* sections */
.sec{padding:64px 0}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
.sec-h p{color:var(--muted);margin-top:6px}
.band{background:#fff;border-block:1px solid var(--line)}

/* destination tiles */
.dest-row{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:200px;gap:16px}
.dest{position:relative;border-radius:var(--r-lg);overflow:hidden;color:#fff;display:block;isolation:isolate}
.dest img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s ease;z-index:-2}
.dest::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(20,31,42,.82));z-index:-1}
.dest:hover img{transform:scale(1.05)}
.dest .dc{position:absolute;inset-inline:16px;bottom:14px}
.dest h3{color:#fff;font-size:20px}
.dest small{color:#D6E2EC}
.dest.big{grid-row:span 2;grid-column:span 2}
.dest.big h3{font-size:28px}
@media (max-width:900px){.dest-row{grid-template-columns:repeat(2,1fr);grid-auto-rows:170px}.dest.big{grid-column:span 2;grid-row:span 1}}

/* trip card */
.tcard{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .2s,border-color .2s}
.tcard:hover{box-shadow:var(--sh-2);border-color:#d4dde6}
.tcard .media{position:relative;aspect-ratio:16/10;background:var(--navy-100);overflow:hidden}
.tcard .media img{width:100%;height:100%;object-fit:cover}
.tcard .fav{position:absolute;top:10px;inset-inline-end:10px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);border:0;display:grid;place-items:center;cursor:pointer;color:var(--navy)}
.tcard .fav.on svg{fill:#E0584A;stroke:#E0584A}
.tcard .tag{position:absolute;top:12px;inset-inline-start:12px;background:rgba(20,31,42,.7);color:#fff;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;backdrop-filter:blur(4px)}
.tcard .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.tcard h3{font-size:17px;line-height:1.45}
.tcard .co{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.tcard .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.tcard .meta span{display:inline-flex;gap:5px;align-items:center}
.tcard .meta svg{width:15px;height:15px}
.tcard .desc{font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tcard .foot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:auto;padding-top:12px;border-top:1px dashed var(--line)}
.price{font-family:var(--f-disp);font-weight:700;color:var(--navy);font-size:20px;line-height:1.2}
.price small{font-family:var(--f-body);font-weight:500;color:var(--faint);font-size:12px;display:block}
.seats{font-size:12.5px;font-weight:600}
.seats.low{color:var(--bad)}
.seats.ok{color:var(--teal-700)}
.co-logo{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;font-family:var(--f-disp);flex:none}
.co-logo.lg{width:72px;height:72px;border-radius:18px;font-size:28px}
.co-logo.md{width:44px;height:44px;border-radius:12px;font-size:18px}
.co-logo img{width:100%;height:100%;object-fit:cover;border-radius:inherit}

/* listing */
.list-layout{display:grid;grid-template-columns:290px 1fr;gap:28px;align-items:start}
.filters{position:sticky;top:88px;padding:18px}
.filters .fg{padding:14px 0;border-bottom:1px solid var(--line-2)}
.filters .fg:last-child{border-bottom:0}
.filters h4{margin-bottom:10px}
.opt{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14.5px;cursor:pointer}
.opt input{accent-color:var(--teal);width:16px;height:16px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.filters-toggle{display:none}
@media (max-width:980px){.list-layout{grid-template-columns:1fr}.filters{position:fixed;inset:0;z-index:70;border-radius:0;overflow:auto;display:none}.filters.open{display:block}.filters-toggle{display:inline-flex}}

/* page header band */
.phead{background:var(--navy);color:#fff;padding:36px 0 32px;position:relative;overflow:hidden}
.phead h1{color:#fff;font-size:clamp(24px,3.4vw,36px)}
.phead p{color:#C7D5E2;margin-top:6px}
.crumbs{font-size:13px;color:#9FB3C6;display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.crumbs a:hover{color:#fff}

/* trip details */
.gallery{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:repeat(2,190px);gap:10px;border-radius:var(--r-lg);overflow:hidden}
.gallery button{border:0;padding:0;cursor:zoom-in;background:var(--navy-100);overflow:hidden}
.gallery img{width:100%;height:100%;object-fit:cover}
.gallery button:first-child{grid-row:span 2}
@media (max-width:640px){.gallery{grid-template-columns:1fr 1fr;grid-template-rows:220px 120px}.gallery button:first-child{grid-column:span 2;grid-row:span 1}}

.camp h3{color:#fff;font-size:19px}
.camp p{color:#D6E2EC;font-size:14px}
.camp .pct{position:absolute;top:16px;inset-inline-end:16px;background:var(--sand);color:var(--navy-950);border-radius:16px;padding:6px 12px;font-family:var(--f-disp);font-weight:800;font-size:22px;line-height:1.1;text-align:center}
.camp .pct small{display:block;font-size:11px;font-weight:600}
.camp .top{position:absolute;top:16px;inset-inline-start:16px}
.camp-band{border:1px solid var(--line);border-radius:var(--r-xl);background:#fff;overflow:hidden}
.camp-band .bh{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:18px 20px;border-bottom:1px solid var(--line-2)}
/* platform rating */
.pstars{display:inline-flex;gap:1px;align-items:center;direction:ltr}
.pstars svg{width:15px;height:15px;fill:var(--line);stroke:none}
.pstars svg.on{fill:var(--sand)}
.prate{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--navy);background:var(--sand-50);border:1px solid #F1DDBB;border-radius:8px;padding:2px 8px;white-space:nowrap}
.rate-in{display:inline-flex;gap:0;direction:ltr;align-items:center}
.rate-in button{border:0;background:none;padding:2px;cursor:pointer;line-height:0}
.rate-in svg{width:20px;height:20px;fill:var(--line);stroke:none;transition:fill .1s}
.rate-in button.on svg{fill:var(--sand)}
.rate-in:hover button svg{fill:var(--sand)}
.rate-in button:hover~button svg{fill:var(--line)}
.rank{width:28px;height:28px;border-radius:9px;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:13px;flex:none}
.rank.r1{background:var(--sand);color:var(--navy-950)}
/* compare */
.cmp-btn{position:absolute;top:10px;inset-inline-end:54px;height:36px;padding:0 10px;border-radius:18px;background:rgba(255,255,255,.92);border:0;display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--navy);font-weight:600;font-size:12.5px}
.cmp-btn .bx{width:16px;height:16px;border-radius:5px;border:2px solid var(--navy);display:grid;place-items:center}
.cmp-btn.on{background:var(--teal);color:#fff}
.cmp-btn.on .bx{border-color:#fff;background:#fff;color:var(--teal)}
.cmp-btn .bx svg{width:12px;height:12px;stroke-width:3}
.cmp-tray{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:50;background:var(--navy-950);color:#fff;border-radius:18px;box-shadow:var(--sh-3);padding:10px 12px;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px)}
.cmp-tray .th{display:flex;gap:6px}
.cmp-tray .th img{width:44px;height:32px;border-radius:7px;object-fit:cover;border:2px solid rgba(255,255,255,.2)}
.cmp-tray .slot{width:44px;height:32px;border-radius:7px;border:2px dashed rgba(255,255,255,.25)}
@media (max-width:560px){.cmp-tray .th{display:none}}
.cmp-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:#fff}
table.cmp{border-collapse:separate;border-spacing:0;width:100%;min-width:720px;font-size:14px}
.cmp th,.cmp td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:top;text-align:start}
.cmp th[scope=row]{position:sticky;inset-inline-start:0;background:#FAFBFD;color:var(--muted);font-weight:600;font-size:13px;width:150px;min-width:130px;z-index:1;border-inline-end:1px solid var(--line-2)}
.cmp thead td{vertical-align:bottom;min-width:200px}
.cmp tr:last-child td,.cmp tr:last-child th{border-bottom:0}
.cmp td.best{background:var(--teal-50)}
.best-tag{display:inline-block;margin-inline-start:6px;font-size:11px;font-weight:700;color:var(--teal-700);background:#fff;border:1px solid #BFE6E6;border-radius:6px;padding:0 6px;vertical-align:middle}
.cmp .tt img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;margin-bottom:8px}

/* installable app */
#install-layer{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:90;display:flex;flex-direction:column;gap:10px;align-items:flex-start;pointer-events:none}
.install-bar{pointer-events:auto;width:100%;max-width:440px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-3);padding:12px 12px 12px 14px;display:flex;gap:12px;align-items:center;animation:pop .25s ease-out}
.install-bar b{color:var(--navy);font-size:14.5px;display:block}
.install-bar p{font-size:12.5px;color:var(--muted);line-height:1.5}
.install-bar .ib-logo{width:44px;height:44px;border-radius:12px;flex:none}
.ib-ic{width:36px;height:36px;border-radius:10px;background:var(--teal-50);color:var(--teal-700);display:grid;place-items:center;flex:none}
.install-bar.upd{background:var(--navy-950);border-color:var(--navy-950)}
.install-bar.upd b{color:#fff}.install-bar.upd p{color:#B9C7D4}
body.install-open .cmp-tray{bottom:calc(110px + env(safe-area-inset-bottom))}
body.install-open .toasts{bottom:110px}
.install-steps{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:st}
.install-steps li{display:flex;gap:12px;align-items:center;font-size:14.5px}
@media (display-mode: standalone){.site-h{padding-top:env(safe-area-inset-top)}.topbar{padding-top:env(safe-area-inset-top);height:calc(64px + env(safe-area-inset-top))}}

@media print{
  .site-h,.site-f,.side,.topbar,.no-print,.toasts{display:none!important}
  body{background:#fff}
  .dash{display:block}.content{padding:0}
  .pass{box-shadow:none}
}
/* custom trip requests */
.plan-band{display:flex;gap:28px;align-items:center;flex-wrap:wrap;padding:28px 32px;border-radius:22px;background:linear-gradient(120deg,var(--navy) 0%,#1d4b6e 60%,var(--teal-700) 100%);color:#fff;box-shadow:var(--sh-2)}
.plan-band h2{color:#fff;font-size:24px}.plan-band p{color:#d5e5ef;margin-top:6px;max-width:620px}
.plan-steps{list-style:none;padding:0;margin:16px 0 0;display:flex;gap:10px;flex-wrap:wrap;counter-reset:ps}
.plan-steps li{counter-increment:ps;display:flex;flex-direction:column;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:8px 14px 8px 14px;font-size:13px;color:#cfe0ea}
.plan-steps li b{color:#fff;font-size:14px}.plan-steps li b::before{content:counter(ps) ". ";color:var(--sand)}
.plan-alert{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border:1px solid var(--sand);background:linear-gradient(90deg,#FFF8EC,#fff)}
.plan-alert.co{border-color:var(--teal);background:linear-gradient(90deg,var(--teal-50),#fff)}
.plan-alert .ib-ic{width:44px;height:44px;border-radius:12px}
.offer{display:flex;flex-direction:column;overflow:hidden}.offer.dim{opacity:.62}
.offer-foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-top:1px solid var(--line-2);background:#FBFCFD}
.chat-wrap{padding:0 16px 16px;border-top:1px solid var(--line-2)}
.thread .msgs{display:flex;flex-direction:column;gap:10px;max-height:340px;overflow:auto;padding-top:12px}
.msg{max-width:85%;align-self:flex-start}.msg .mb{background:var(--line-2);padding:9px 13px;border-radius:14px;border-start-start-radius:4px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.msg.mine{align-self:flex-end;text-align:end}.msg.mine .mb{background:var(--teal-50);color:#0b4d4d;border-radius:14px;border-start-end-radius:4px;text-align:start}
.nav-count{margin-inline-start:auto;background:var(--sand);color:var(--navy);font-size:11.5px;font-weight:800;border-radius:999px;min-width:20px;height:20px;padding:0 6px;display:inline-grid;place-items:center}
@media(max-width:640px){.plan-band{padding:22px 18px}.plan-band h2{font-size:20px}.msg{max-width:95%}}

/* =========================================================
   UTRAVEL — Modern Tech identity layer (from the "UTravel Modern Tech" design package),
   recoloured to the official UTravel Color Palette. Visual only: no routes or logic change.
   ========================================================= */
:root{
  --r-sm:10px; --r:14px; --r-lg:20px; --r-xl:28px;
  --sh-1:0 2px 8px rgba(20,31,42,.05);
  --sh-2:0 12px 30px rgba(20,31,42,.10);
  --sh-3:0 28px 70px rgba(20,31,42,.22);
}
body{background:var(--bg);letter-spacing:0}
h1,h2,h3,h4{letter-spacing:-.02em}
[dir=ltr] h1,[dir=ltr] .phead h1,[dir=ltr] .sec-h h2{font-family:var(--f-brand);font-weight:400;letter-spacing:0}
::selection{background:rgba(111,158,198,.28);color:var(--navy-950)}
:focus-visible{outline:3px solid var(--teal-700);outline-offset:3px}
.btn{border-radius:12px;font-weight:700;letter-spacing:-.01em;box-shadow:none}
.btn-primary{background:linear-gradient(135deg,var(--navy),var(--navy-700));box-shadow:0 5px 14px rgba(30,63,91,.16)}
.btn-primary:hover{background:linear-gradient(135deg,var(--navy-700),#356489);box-shadow:0 8px 20px rgba(30,63,91,.22)}
.btn-teal{background:var(--teal-700);color:#fff;box-shadow:0 5px 14px rgba(61,108,147,.18)}
.btn-teal:hover{background:#335E82}
.btn-sand{background:var(--sand);color:var(--ink)}
.btn-sand:hover{background:#BE9E62}
.btn-soft{background:var(--teal-50);color:var(--navy)}
.btn-ghost,.icon-btn,.lang-btn{border-color:var(--line);background:rgba(255,255,255,.9)}
.icon-btn{border-radius:12px}
.input,.select,.textarea{border-radius:12px;border-color:#DDD7CB;background:#fff}
.input:focus,.select:focus,.textarea:focus{border-color:var(--teal-700);box-shadow:0 0 0 4px rgba(111,158,198,.22)}
.seg{background:#EEEAE2;border-radius:13px}
.seg button{border-radius:10px}
.seg button.on{box-shadow:0 2px 8px rgba(20,31,42,.08)}
.chip{border-radius:999px;border-color:#E0DACE}
.chip.on{background:var(--navy);border-color:var(--navy)}
.card,.tcard{border-color:#E7E2D8;border-radius:20px;box-shadow:var(--sh-1)}
.card-h{border-color:var(--line-2)}
.tcard{transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease}
.tcard:hover{transform:translateY(-3px);box-shadow:var(--sh-2);border-color:rgba(111,158,198,.6)}
.site-h{background:rgba(247,245,240,.9);border-color:rgba(229,224,214,.9);backdrop-filter:saturate(1.4) blur(16px)}
.site-h .wrap{height:72px}
.nav a{border-radius:11px}
.nav a:hover{background:var(--teal-50);color:var(--teal-700)}
.nav a.on{background:var(--teal-50);color:var(--navy)}
.lang-btn{border-radius:11px}
.avatar{background:linear-gradient(145deg,#E3CFA6,var(--sand));color:var(--navy-950);box-shadow:inset 0 0 0 1px rgba(126,96,42,.14)}
.hero{background:radial-gradient(ellipse at 82% 15%,rgba(111,158,198,.26),transparent 40%),linear-gradient(125deg,var(--navy-950),var(--navy) 62%,#24506F)}
.hero-art::after{background:linear-gradient(180deg,rgba(20,31,42,.12) 0%,rgba(20,31,42,.40) 45%,rgba(20,31,42,.90) 100%)}
.hero-in{padding-block:104px 44px;min-height:580px}
.hero p.lead{color:#E3E9EF}
.ticket{border:1px solid rgba(255,255,255,.72);border-radius:22px;box-shadow:0 24px 65px rgba(0,0,0,.25)}
.ticket .go .btn{border-radius:13px}
.sec{padding:72px 0}
.sec-h{margin-bottom:28px}
.band{background:linear-gradient(180deg,#fff,#FBFAF7);border-color:var(--line)}
.dest{border-radius:22px}
.dest::after{background:linear-gradient(180deg,rgba(20,31,42,.02) 15%,rgba(20,31,42,.78) 100%)}
.tcard .media{background:#ECE7DD}
.tcard .tag{border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(10px)}
.price{letter-spacing:-.03em}
.filters{border-radius:20px}
.phead{background:radial-gradient(ellipse at 85% 0%,rgba(111,158,198,.24),transparent 44%),linear-gradient(120deg,var(--navy-950),var(--navy))}
.badge{border-radius:999px;padding:3px 10px}
.b-teal{background:var(--teal-50);color:var(--teal-700)}
.progress{height:9px;background:#ECE7DD}
.progress b{background:linear-gradient(90deg,var(--teal-700),var(--teal))}
.menu{border-radius:16px;border-color:var(--line);box-shadow:var(--sh-3)}
.m-nav{box-shadow:var(--sh-2)}
.upload{border-radius:16px;background:#FBFAF7}
details.faq{border-radius:16px;border-color:var(--line)}
details.faq[open]{border-color:rgba(111,158,198,.6);box-shadow:var(--sh-1)}
.side{background:linear-gradient(180deg,var(--navy-950),var(--navy-900))}
.side nav a.on{background:rgba(111,158,198,.18);color:#fff;box-shadow:inset 3px 0 0 var(--sand)}
[dir=rtl] .side nav a.on{box-shadow:inset -3px 0 0 var(--sand)}
.plan-band{background:linear-gradient(120deg,var(--navy-950) 0%,var(--navy) 60%,#2E5A7E 100%)}
.plan-steps li b::before{color:var(--sand)}
@media(max-width:640px){
  .hero-in{min-height:520px;padding-block:80px 30px}
  .sec{padding:52px 0}
  .card-pad{padding:16px}
  .site-h .wrap{height:64px}
}
@media(prefers-reduced-motion:no-preference){
  .btn,.icon-btn,.nav a,.chip{transition:background .18s ease,border-color .18s ease,box-shadow .18s ease,transform .18s ease}
}

/* ---------- UTravel logo ---------- */
.logo{gap:10px;letter-spacing:0}
.ut-logo{display:inline-flex;flex-direction:column;align-items:center;line-height:1;color:var(--navy);
  --ut-star-d:var(--navy);--ut-star-l:var(--teal)}
.ut-word{display:inline-flex;align-items:baseline;font-family:var(--f-brand);font-weight:400;font-size:34px;letter-spacing:.005em;white-space:nowrap}
.ut-t{height:.97em;width:auto;margin:0 -.02em 0 0;align-self:baseline;transform:translateY(.045em);overflow:visible}
.ut-tag{font-family:var(--f-brand);font-weight:400;letter-spacing:.03em;margin-top:.5em;color:inherit;opacity:.92;font-size:12.5px;white-space:nowrap}
.ut-dark{color:#F7F5F0;--ut-star-d:#F7F5F0;--ut-star-l:var(--teal);--ut-globe-1:rgba(247,241,228,.22);--ut-globe-2:rgba(200,169,110,.30)}
.ut-mono{color:currentColor;--ut-gold-1:currentColor;--ut-gold-2:currentColor;--ut-gold-3:currentColor;--ut-star-d:currentColor;--ut-star-l:currentColor;--ut-globe-1:transparent;--ut-globe-2:transparent}
.ut-lg .ut-word{font-size:46px}.ut-lg .ut-tag{font-size:16px}
.side .logo{padding:6px 8px 18px}
.side .ut-word{font-size:34px}.side .ut-tag{font-size:12px}

.logo-mark{width:40px;height:40px;border-radius:12px;background:transparent;box-shadow:none}
.logo-mark .ut-t{height:36px;transform:none}
@media(max-width:640px){.site-h .ut-word{font-size:27px}.site-h .ut-tag{font-size:9.5px;letter-spacing:.01em}}

/* show / hide password */
.pw-wrap{position:relative}
.pw-wrap .input{padding-inline-end:46px}
[dir=ltr] .pw-wrap .input,.pw-wrap .input[dir=ltr]{padding-right:46px;padding-left:12px}
.pw-eye{position:absolute;top:50%;transform:translateY(-50%);right:6px;width:36px;height:36px;border:0;border-radius:10px;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.pw-eye:hover{background:var(--teal-50);color:var(--navy)}
.pw-eye svg{width:19px;height:19px}

/* tagline placements */
.site-h .wrap{height:84px}
.site-h .ut-tag{font-size:11.5px;margin-top:.4em;color:var(--teal-700);opacity:1}
.hero-kicker{display:inline-block;font-family:var(--f-brand);font-size:17px;letter-spacing:.06em;color:var(--sand);margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid rgba(200,169,110,.55)}
.auth-brand{position:absolute;top:34px;inset-inline-start:34px;z-index:1}
.auth-brand .ut-word{font-size:40px;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.auth-brand .ut-tag{font-size:14px;text-shadow:0 1px 8px rgba(0,0,0,.45)}
.auth-art::before{content:"";position:absolute;inset:0 0 auto 0;height:180px;background:linear-gradient(180deg,rgba(20,31,42,.55),transparent);z-index:1}
.ut-doc{align-items:flex-start}.ut-doc .ut-word{font-size:26px}.ut-doc .ut-tag{font-size:11px}
@media(max-width:640px){.site-h .wrap{height:70px}.hero-kicker{font-size:15px}}

/* ===== Mobile & app UX layer (UX review, Nov 2026) ===== */
/* hero tagline: readable on a bright sky */
.hero-kicker{background:rgba(20,31,42,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(200,169,110,.5);border-radius:999px;padding:6px 16px;color:#EBD9B3;align-self:flex-start}
/* .sec's padding shorthand was wiping .wrap's side padding on "wrap sec" pages (content touched the screen edge on phones) */
.wrap.sec{padding-inline:20px}
/* lists: a grid column must never grow past the screen */
.list-layout>*{min-width:0}
/* readable date fields (overlay from 5b-mobile.js) */
.dx{position:relative;display:inline-flex;align-items:center;min-width:0;flex:1}
.dx-block{display:flex;width:100%}
.dx>input{width:100%!important}
.price-pair .dx{width:50%}
.dx:not(:focus-within)>input{color:transparent}

.dx-v{position:absolute;inset:0;display:flex;align-items:center;pointer-events:none;font-weight:600;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:30px}
.dx-block .dx-v{padding-left:12px;padding-right:42px;font-weight:400;color:var(--ink)}
.date-pair .dx-v{font-size:15px}
.dx-empty .dx-v{color:var(--faint);font-weight:500}

/* trip page */
.t-actions{flex-wrap:wrap}
.m-book,.tabbar{display:none}
@media(max-width:980px){

  body:has(.tabbar){padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  body:has(.tabbar) .toasts,body:has(.tabbar) .cmp-tray,body:has(.tabbar) #install-layer{bottom:calc(76px + env(safe-area-inset-bottom))}
  body:has(.tabbar) .m-book{bottom:calc(64px + env(safe-area-inset-bottom));padding-bottom:10px}

  .side .side-foot{padding-bottom:calc(8px + env(safe-area-inset-bottom))}
  body:has(.tabbar) .topbar a.icon-btn[href$="/notifications"]{display:none}
  /* touch targets: 44px minimum */
  .btn-sm{height:44px;padding:0 14px}

@media(max-width:640px){
  .hero-kicker{display:none}
  .hero-in{min-height:0;padding-block:44px 26px}
  .hero h1{font-size:30px;line-height:1.35}
  .hero p.lead{font-size:15.5px;margin-top:10px}
  .phead{padding:22px 0 20px}.phead p{font-size:14.5px}
  .sec{padding:40px 0}
  .sec-h{align-items:center;margin-bottom:18px}.sec-h p{font-size:14px}
  /* sections scroll sideways instead of stacking */
  .rail{display:grid!important;grid-template-columns:none!important;grid-auto-flow:column;grid-auto-columns:84%;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;gap:14px!important;margin-inline:-20px;padding:4px 20px 14px;scroll-padding-inline:20px;scrollbar-width:none}
  .rail::-webkit-scrollbar,.rail-dest::-webkit-scrollbar{display:none}
  .rail>*{scroll-snap-align:start;min-width:0}
  .rail-dest{grid-template-columns:none!important;grid-auto-flow:column;grid-auto-columns:64%;grid-template-rows:210px;grid-auto-rows:210px!important;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-20px;padding:0 20px 8px;scroll-padding-inline:20px;scrollbar-width:none}
  .rail-dest .dest{grid-column:auto!important;grid-row:auto!important;scroll-snap-align:start}
  /* compact trip cards */
  .tcard .media{aspect-ratio:16/9}
  .tcard .desc{display:none}
  .tcard .body{padding:12px 14px 14px;gap:6px}
  .tcard h3{font-size:16px}
  .tcard:hover{transform:none}
  /* trips toolbar: one row, stays under the header */
  .toolbar{position:sticky;top:70px;z-index:25;background:var(--bg);margin:-8px -20px 14px;padding:8px 20px;flex-wrap:nowrap;border-bottom:1px solid var(--line-2)}
  .toolbar .sort-t{display:none}
  .toolbar .select{max-width:170px}
  .camp-note{flex-direction:column;align-items:flex-start!important}
  /* dashboards: tables become cards */
  .tbl-cards thead{display:none}
  .tbl-cards,.tbl-cards tbody{display:block}
  .tbl-cards tr{display:block;padding:10px 16px;border-bottom:1px solid var(--line)}
  .tbl-cards tr:last-child{border-bottom:0}
  .tbl-cards td{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:5px 0;border:0!important;text-align:end;min-height:32px}
  .tbl-cards td::before{content:attr(data-label);color:var(--muted);font-size:12.5px;font-weight:600;text-align:start;flex:none}
  .tbl-cards td[data-label=""]{justify-content:flex-end}
  .tbl-cards td[data-label=""]::before{display:none}
  .tbl-cards tbody tr:hover td{background:none}
  .tbl-tools{display:grid;grid-template-columns:1fr 1fr}
  .tbl-tools .search{grid-column:1/-1;min-width:0}
  .tbl-tools .input,.tbl-tools .select{width:100%;min-width:0}
  .tbl-tools>.btn{grid-column:1/-1;justify-content:center}
  /* alerts: the action goes under the text */
  .callout:has(>.btn){flex-wrap:wrap}
  .callout:has(>.btn)>.grow{flex:1 1 calc(100% - 44px)}
  .callout>.btn{width:100%}
  .plan-alert>.grow{flex:1 1 calc(100% - 64px)}
  .plan-alert>.btn,.plan-alert>a.btn{width:100%;justify-content:center}
  /* toasts span the screen */
  .toasts{inset-inline:12px;max-width:none}
}

const ART_CACHE = {};
function rng(seed) { let s = seed * 9301 + 49297; return () => ((s = (s * 9301 + 49297) % 233280) / 233280); }

/* ---------- 4. Data layer ----------
   Persistence: localStorage (one JSON document). `tx(fn)` is the only way to
   write: it re-reads the latest committed state (so a second tab can't sell
   the same seat), runs fn on a copy, and commits only if fn doesn't throw —
   the same all‑or‑nothing contract a Prisma $transaction gives on PostgreSQL. */
let MEMORY_ONLY = false;
let db = null;
function readDB() {
  try { const raw = localStorage.getItem(DB_KEY); if (raw) { const d = JSON.parse(raw); if (d.version === DB_VERSION) return d; } } catch (e) { MEMORY_ONLY = true; }
  return null;
}
function writeDB(d) {
  if (MEMORY_ONLY) return;
  try { localStorage.setItem(DB_KEY, JSON.stringify(d)); }
  catch (e) { const err = new Error('STORAGE_FULL'); err.code = 'STORAGE_FULL'; throw err; }
}
function initDB() { db = readDB(); if (!db) { db = seedDB(); try { writeDB(db); } catch (e) { MEMORY_ONLY = true; } } sweep(); }
function resetDB() { db = seedDB(); try { writeDB(db); } catch (e) { } }
class AppError extends Error { constructor(code, msg) { super(msg || code); this.code = code; } }
function tx(fn) {
  const fresh = readDB() || db;
  const draft = JSON.parse(JSON.stringify(fresh));
  const result = fn(draft);          // throws → nothing is committed
  writeDB(draft);
  db = draft;
  return result;
}
window.addEventListener('storage', (e) => { if (e.key === DB_KEY) { const d = readDB(); if (d) { db = d; render(); } } });

/* housekeeping run on load: expire seat holds, complete finished trips */
function sweep() {
  const now = Date.now(); let changed = false;
  db.bookings.forEach((b) => {
    if (b.status === 'pending_payment' && b.holdUntil && new Date(b.holdUntil).getTime() < now) { b.status = 'cancelled'; b.paymentStatus = 'failed'; b.cancelReason = 'hold_expired'; changed = true; }
    if (b.status === 'confirmed') { const d = depById(b.departureId); if (d && new Date(d.end) < TODAY) { b.status = 'completed'; changed = true; } }
  });
  db.departures.forEach((d) => { if (d.status === 'open' && new Date(d.start) <= TODAY) { d.status = 'closed'; changed = true; } });
  if (requestSweep(db)) changed = true;
  if (changed) { try { writeDB(db); } catch (e) { } }
}

/* ---------- repositories / selectors ---------- */
const byId = (arr, id) => arr.find((x) => x.id === id);
const userById = (id) => byId(db.users, id) || { id, name: tr('مسافر', 'Traveller'), phone: '', email: '', role: 'customer', status: 'active' };

const depById = (id) => byId(db.departures, id);

const SEAT_STATUSES = ['confirmed', 'completed', 'refund_pending'];
function seatInfo(dep, d) {
  d = d || db; const now = Date.now();
  let booked = 0, held = 0;
  d.bookings.forEach((b) => {
    if (b.departureId !== dep.id) return;
    if (SEAT_STATUSES.includes(b.status)) booked += b.count;
    else if (b.status === 'pending_payment' && b.holdUntil && new Date(b.holdUntil).getTime() > now) held += b.count;
  });
  return { seats: dep.seats, booked, held, remaining: Math.max(0, dep.seats - booked - held) };
}
const isBookable = (dep) => dep.status === 'open' && new Date(dep.start) > TODAY;
const upcomingDeps = (tripId) => db.departures.filter((d) => d.tripId === tripId && isBookable(d)).sort((a, b) => a.start.localeCompare(b.start));
function tripReviews(tripId) { return db.reviews.filter((r) => r.tripId === tripId).sort((a, b) => b.createdAt.localeCompare(a.createdAt)); }
function companyReviews(cid) { return db.reviews.filter((r) => r.companyId === cid).sort((a, b) => b.createdAt.localeCompare(a.createdAt)); }
const ratingOf = (revs) => avg(revs.map((r) => r.ratings.overall));
const companyRating = (cid) => { const r = companyReviews(cid); return { avg: avg(r.map((x) => x.ratings.company)), count: r.length }; };
function tripStats(t) {
  const deps = upcomingDeps(t.id); const avail = deps.filter((d) => seatInfo(d).remaining > 0);
  const revs = tripReviews(t.id);
  const booked = db.bookings.filter((b) => b.tripId === t.id && SEAT_STATUSES.includes(b.status)).reduce((a, b) => a + b.count, 0);
  return { deps, avail, next: avail[0] || deps[0] || null, minPrice: avail.length ? Math.min(...avail.map((d) => d.price)) : (deps.length ? Math.min(...deps.map((d) => d.price)) : t.basePrice), rating: ratingOf(revs), reviews: revs.length, remaining: avail[0] ? seatInfo(avail[0]).remaining : 0, popularity: (t.popular || 0) + booked * 3 };
}

function companyFinance(cid) {
  const bs = db.bookings.filter((b) => b.companyId === cid && (SEAT_STATUSES.includes(b.status) || b.status === 'refunded' && retained(b) > 0 || b.status === 'cancelled' && b.paymentStatus === 'paid'));
  const gross = sum(bs, retained), commission = sum(bs, (b) => b.commission), net = gross - commission;
  const earned = bs.filter((b) => b.status === 'completed' || (b.status === 'refunded' || b.status === 'cancelled') && new Date((depById(b.departureId) || {}).end) < TODAY);
  const earnedNet = sum(earned, (b) => retained(b) - b.commission);
  const escrow = net - earnedNet;
  const settled = sum(db.settlements.filter((s) => s.companyId === cid), (s) => s.amount);
  return { gross, commission, net, earnedNet, escrow, settled, payable: Math.max(0, earnedNet - settled), count: bs.length };

function fromRow(m, r) {
  const o = Object.assign({}, r.data || {});
  Object.entries(m.c).forEach(([k, col]) => { if (r[col] !== undefined) o[k] = r[col]; });
  ['price', 'seats', 'total', 'commission', 'commissionRate', 'refunded', 'amount', 'pct', 'count'].forEach((k) => { if (o[k] != null && typeof o[k] === 'string') o[k] = +o[k]; });

}
function toRow(m, o) {

}
async function fetchAll(table) {
  const out = []; const page = 1000;
  for (let from = 0; ; from += page) {
    const { data, error } = await sb.from(table).select('*').range(from, from + page - 1);
    if (error) throw error;
    out.push(...data); if (data.length < page) break;
  }
  return out;
}

/* push the difference between two snapshots; RLS + triggers on the server decide what sticks */
async function pushDiff(before, after) {
  const jobs = [];
  for (const k of ORDER) {
    const m = MAP[k]; if (m.ro) continue;
    const old = new Map((before[k] || []).map((x) => [x.id, x])), nw = new Map((after[k] || []).map((x) => [x.id, x]));
    const ins = [], upd = [], del = [];
    nw.forEach((o, id) => { const p = old.get(id); if (!p) ins.push(o); else if (JSON.stringify(p) !== JSON.stringify(o)) upd.push(o); });
    old.forEach((o, id) => { if (!nw.has(id)) del.push(id); });
    jobs.push({ k, m, ins, upd, del });
  }
  for (const j of jobs) {
    if (j.ins.length) { const { error } = await sb.from(j.m.t).insert(j.ins.map((o) => toRow(j.m, o))); if (error) throw error; }
    for (const o of j.upd) { const r = toRow(j.m, o); delete r.id; const { error } = await sb.from(j.m.t).update(r).eq('id', o.id); if (error) throw error; }
  }
  for (const j of jobs.slice().reverse()) if (j.del.length) { const { error } = await sb.from(j.m.t).delete().in('id', j.del); if (error) throw error; }
  if (JSON.stringify(before.settings) !== JSON.stringify(after.settings)) { const { error } = await sb.from('settings').update({ data: after.settings }).eq('id', 'main'); if (error) throw error; }
}

function cloudTx(fn) {
  const before = db; const draft = JSON.parse(JSON.stringify(db));
  const result = fn(draft);
  db = draft;
  SYNCING = SYNCING.then(() => pushDiff(before, draft)).catch((e) => { toast(cloudMsg(e), 'bad'); return reloadCloud(); });
  return result;
}

async function rpc(name, args) {
  const { data, error } = await sb.rpc(name, args);

}

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const ACTIONS = {}, FORMS = {}, CHANGES = {};
const UI = { tables: {}, tableState: {}, menu: null, mnav: false, side: false, after: [] };

function toast(msg, kind) {
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || 'ok');
  el.innerHTML = ic(kind === 'bad' ? 'alert' : kind === 'info' ? 'info' : 'check') + `<div>${msg}</div>`;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, kind === 'bad' ? 5200 : 3400);
}
function closeModal() { $('#layer').innerHTML = ''; document.body.style.overflow = ''; }
function modal({ title, body, foot, wide, onOpen }) {
  $('#layer').innerHTML = `<div class="modal-bg"><div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-h"><h3>${title}</h3><button class="icon-btn" data-a="close-modal" aria-label="${tr('إغلاق', 'Close')}">${ic('x')}</button></div><div class="modal-b">${body}</div>${foot ? `<div class="modal-f">${foot}</div>` : ''}</div></div>`;
  document.body.style.overflow = 'hidden';
  const f = $('#layer input, #layer select, #layer textarea, #layer .modal-f .btn'); if (f) setTimeout(() => f.focus(), 30);
  if (onOpen) onOpen($('#layer .modal'));
}
/** confirmDialog → Promise<boolean>. Used for every destructive action. */
function confirmDialog({ title, text, ok, danger, input }) {
  return new Promise((res) => {
    modal({ title, body: `<p class="muted">${text}</p>${input ? `<div class="field" style="margin-top:14px"><label for="cf-in">${input}</label><textarea class="textarea" id="cf-in" rows="3"></textarea></div>` : ''}`,
      foot: `<button class="btn btn-ghost" data-a="cf-no">${tr('رجوع', 'Go back')}</button><button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-a="cf-yes">${ok}</button>` });
    ACTIONS['cf-yes'] = () => { const v = input ? $('#cf-in').value.trim() : true; closeModal(); res(v || (input ? '' : true)); };
    ACTIONS['cf-no'] = () => { closeModal(); res(false); };
  });
}
ACTIONS['close-modal'] = closeModal;
// clicking the dimmed backdrop (not the dialog) closes it
document.addEventListener('click', (e) => { if (e.target.classList && e.target.classList.contains('modal-bg')) closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if ($('#layer').innerHTML) closeModal(); if (UI.menu) { UI.menu = null; render(); } } });

/* event delegation */
document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-a]');
  if (UI.menu && !e.target.closest('.user-menu')) { UI.menu = null; $$('.menu').forEach((m) => m.remove()); }
  if (!a) return;
  const fn = ACTIONS[a.dataset.a];
  if (fn) { e.preventDefault(); try { const r = fn(a, e); if (r && r.catch) r.catch(handleErr); } catch (err) { handleErr(err); } }
});
document.addEventListener('submit', (e) => {
  const f = e.target.closest('form[data-f]'); if (!f) return;
  e.preventDefault();
  const fn = FORMS[f.dataset.f]; if (fn) { try { const r = fn(f, e); if (r && r.catch) r.catch(handleErr); } catch (err) { handleErr(err); } }
});
document.addEventListener('input', (e) => { const el = e.target.closest('[data-on]'); if (el && CHANGES[el.dataset.on]) CHANGES[el.dataset.on](el, e); const fe = e.target.closest('.field.err'); if (fe) fe.classList.remove('err'); });
document.addEventListener('change', (e) => { const el = e.target.closest('[data-ch]'); if (el && CHANGES[el.dataset.ch]) CHANGES[el.dataset.ch](el, e); });
function handleErr(err) {
  console.error(err);
  if (err && err.code === 'STORAGE_FULL') return toast(tr('مساحة التخزين في المتصفح امتلأت. صغّر الصور أو أعد ضبط البيانات التجريبية.', 'Browser storage is full. Use smaller images or reset the demo data.'), 'bad');
  toast((err && err.message) || tr('حدث خطأ غير متوقع.', 'Something went wrong.'), 'bad');

function barChart({ labels, series, h, fmt }) {
  h = h || 240; const W = 640, pad = { t: 14, r: 10, b: 28, l: 54 };
  const max = Math.max(1, ...series.flatMap((s) => s.values)) * 1.1;
  const iw = W - pad.l - pad.r, ih = h - pad.t - pad.b, gw = iw / labels.length, bw = Math.min(30, (gw * 0.7) / series.length);
  const nice = (v) => (fmt ? fmt(v) : (v >= 1e6 ? r1(v / 1e6) + 'M' : v >= 1e3 ? Math.round(v / 1e3) + 'K' : Math.round(v)));

  for (let i = 0; i <= 4; i++) { const y = pad.t + ih - (ih * i) / 4; g += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y}" y2="${y}" stroke="#EEF2F6"/><text x="${pad.l - 8}" y="${y + 4}" text-anchor="end">${nice((max * i) / 4)}</text>`; }
  labels.forEach((lb, i) => {
    const gx = pad.l + gw * i + (gw - bw * series.length) / 2;
    series.forEach((s, k) => { const v = s.values[i], bh = (v / max) * ih; g += `<rect x="${gx + k * bw}" y="${pad.t + ih - bh}" width="${bw - 3}" height="${Math.max(0, bh)}" rx="4" fill="${s.color}"><title>${esc(s.name)}: ${fmtN(v)}</title></rect>`; });
    g += `<text x="${pad.l + gw * i + gw / 2}" y="${h - 8}" text-anchor="middle">${esc(lb)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img" style="direction:ltr" aria-label="${esc(series.map((s) => s.name).join(', '))}">${g}</svg>${series.length > 1 ? `<div class="legend">${series.map((s) => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>` : ''}`;
}
function lineChart({ labels, values, h, color }) {
  h = h || 220; const W = 640, pad = { t: 14, r: 12, b: 28, l: 44 };
  const max = Math.max(1, ...values) * 1.15, iw = W - pad.l - pad.r, ih = h - pad.t - pad.b;
  const pts = values.map((v, i) => [pad.l + (iw * i) / Math.max(1, values.length - 1), pad.t + ih - (v / max) * ih]);
  let g = '';
  for (let i = 0; i <= 4; i++) { const y = pad.t + ih - (ih * i) / 4; g += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y}" y2="${y}" stroke="#EEF2F6"/><text x="${pad.l - 8}" y="${y + 4}" text-anchor="end">${Math.round((max * i) / 4)}</text>`; }
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0] + ' ' + p[1]).join(' ');
  g += `<path d="${d} L${pts[pts.length - 1][0]} ${pad.t + ih} L${pts[0][0]} ${pad.t + ih}z" fill="${color || '#3D6C93'}" opacity=".12"/><path d="${d}" fill="none" stroke="${color || '#3D6C93'}" stroke-width="2.5" stroke-linejoin="round"/>`;
  pts.forEach((p, i) => { g += `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#fff" stroke="${color || '#3D6C93'}" stroke-width="2"><title>${fmtN(values[i])}</title></circle><text x="${p[0]}" y="${h - 8}" text-anchor="middle">${esc(labels[i])}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img" style="direction:ltr">${g}</svg>`;
}

/* ---- trips listing ---- */
function readQuery() { const q = (location.hash.split('?')[1] || ''); return Object.fromEntries(new URLSearchParams(q)); }
function filterTrips(q) {
  let list = publicTrips().map((t) => ({ t, s: tripStats(t) }));
  if (q.q) { const k = q.q.toLowerCase(); list = list.filter(({ t }) => (L(t.title) + ' ' + t.title.ar + ' ' + t.title.en + ' ' + L(destById(t.destId).name) + ' ' + L(compById(t.companyId).name)).toLowerCase().includes(k)); }
  if (q.dest) { const ds = q.dest.split(','); list = list.filter(({ t }) => ds.includes(t.destId)); }
  if (q.cat) { const cs = q.cat.split(','); list = list.filter(({ t }) => cs.includes(t.catId)); }
  if (q.co) list = list.filter(({ t }) => t.companyId === q.co);
  if (q.offer) { const cp = campaigns().find((c) => c.id === q.offer); list = list.filter(({ t }) => cp && (cp.tripIds || []).includes(t.id)); }
  if (q.deals === '1') list = list.filter(({ t }) => tripCampaign(t));
  if (q.dur) list = list.filter(({ t }) => (q.dur === '1' ? t.days === 1 : q.dur === '2-3' ? t.days >= 2 && t.days <= 3 : q.dur === '4-5' ? t.days >= 4 && t.days <= 5 : t.days >= 6));
  if (q.date || q.to) { const from = q.date || '', to = q.to && (!q.date || q.to >= q.date) ? q.to : ''; list = list.filter(({ s }) => s.deps.some((d) => (!from || d.start >= from) && (!to || d.start <= to))); }
  if (q.min) list = list.filter(({ s }) => s.minPrice >= +q.min);
  if (q.max) list = list.filter(({ s }) => s.minPrice <= +q.max);
  if (q.rating) list = list.filter(({ s }) => s.rating >= +q.rating);
  if (q.avail === '1') list = list.filter(({ s }) => s.avail.length > 0);
  const sorts = { price_asc: (a, b) => a.s.minPrice - b.s.minPrice, price_desc: (a, b) => b.s.minPrice - a.s.minPrice, rating: (a, b) => b.s.rating - a.s.rating, popular: (a, b) => b.s.popularity - a.s.popularity, new: (a, b) => b.t.createdAt.localeCompare(a.t.createdAt) };
  list.sort(sorts[q.sort] || sorts.popular);
  return list.map((x) => x.t);
}
function viewTrips() {

  const chk = (key, val, label) => { const on = (q[key] || '').split(',').includes(val); return `<label class="opt"><input type="checkbox" data-ch="flt-multi" data-k="${key}" value="${val}" ${on ? 'checked' : ''}>${esc(label)}</label>`; };
  const rad = (key, val, label) => `<label class="opt"><input type="radio" name="${key}" data-ch="flt-one" data-k="${key}" value="${val}" ${(q[key] || '') === val ? 'checked' : ''}>${esc(label)}</label>`;

/* ---- comparison: up to 4 trips, a separate list per account on this device ----

const cmpKey = (who) => 'rehlati_compare:' + (who || (me() ? me().id : 'guest'));
function cmpRead(key) { try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) { return CMP_MEM[key] || []; } }

/* ---- customer dashboard: top-rated companies & recommended trips ---- */

  return `<div class="card"><div class="card-h"><h3>${tr('الشركات الأعلى تقييمًا', 'Top‑rated operators')}</h3><a class="btn-link small" href="#/companies">${tr('كل الشركات', 'All operators')}</a></div><div class="card-pad stack">

    <p class="xs faint">${tr('الترتيب حسب تقييم فريق UTravel للشركة، وبعده تقييمات العملاء اللي سافروا معاها.', 'Ranked by the UTravel team’s rating, then by reviews from travellers who went with them.')}</p></div></div>`;
}
function recommendedTrips(n) {
  const u = me(), mine = new Set(db.bookings.filter((b) => b.customerId === (u || {}).id).map((b) => b.tripId));
  const rank = new Map(rankedCompanies().map((x, i) => [x.c.id, i]));
  const pool = publicTrips().filter((t) => !mine.has(t.id) && tripStats(t).avail.length && rank.has(t.companyId))
    .sort((a, b) => (rank.get(a.companyId) - rank.get(b.companyId)) || ((tripCampaign(b) ? 1 : 0) - (tripCampaign(a) ? 1 : 0)) || (tripStats(b).rating - tripStats(a).rating));
  // one trip from each top company first, then fill

function cancelDeparture(depId) {
  const dep = depById(depId), t = tripById(dep.tripId);
  tx((x) => {
    assertCompanyOwns(x, byId(x.trips, t.id));
    const d = byId(x.departures, dep.id); d.status = 'cancelled';
    x.bookings.filter((b) => b.departureId === dep.id).forEach((b) => {
      if (b.status === 'pending_payment') { b.status = 'cancelled'; b.paymentStatus = 'failed'; return; }
      if (!['confirmed', 'refund_pending'].includes(b.status)) return;
      x.refunds.filter((r) => r.bookingId === b.id && r.status === 'pending').forEach((r) => { r.status = 'approved'; r.amount = retained(b); r.processedAt = new Date().toISOString(); });
      const amt = retained(b); x.refunds.push({ id: uid('rf'), bookingId: b.id, amount: amt, pct: 100, status: 'approved', reason: 'departure_cancelled_by_company', createdAt: new Date().toISOString(), processedAt: new Date().toISOString() });
      b.refunded = b.total; b.status = 'refunded'; b.paymentStatus = 'refunded'; b.commission = 0;
      x.payments.push({ id: uid('p'), bookingId: b.id, method: (x.payments.find((p) => p.bookingId === b.id && p.status === 'paid') || {}).method || 'card', amount: -amt, status: 'refund', idemKey: 'cxl_' + b.id, txn: 'RF' + Math.floor(1e6 + Math.random() * 9e6), createdAt: new Date().toISOString() });
      notify(x, b.customerId, { ar: 'تم إلغاء الرحلة', en: 'Trip cancelled' }, { ar: `الشركة ألغت موعد ${t.title.ar} يوم ${dep.start}. هيرجعلك ${fmtN(amt)} ج.م بالكامل.`, en: `The operator cancelled ${t.title.en} on ${dep.start}. EGP ${fmtN(amt)} will be refunded in full.` }, '#/me/booking/' + b.ref);
    });
    notify(x, 'admin', { ar: 'إلغاء موعد', en: 'Departure cancelled' }, { ar: `${myCompany().name.ar} ألغت موعد ${dep.start} لرحلة ${t.title.ar}.`, en: `${myCompany().name.en} cancelled ${dep.start} of ${t.title.en}.` }, '#/admin/bookings');
  });
}

function matchRoute(path) {
  for (const [pat, fn, guard] of ROUTES) {
    const a = pat.split('/'), b = path.split('/'); if (a.length !== b.length) continue;
    const p = {}; let ok = true;
    for (let i = 0; i < a.length; i++) { if (a[i].startsWith(':')) p[a[i].slice(1)] = decodeURIComponent(b[i]); else if (a[i] !== b[i]) { ok = false; break; } }
    if (ok) return { fn, p, guard };
  }
  return null;
}
function go(h) { if (location.hash === h) render(); else location.hash = h; }
let LAST_PATH = '';
function render() {
  const h = location.hash.replace(/^#/, '') || '/';
  const path = h.split('?')[0].replace(/\/$/, '') || '/';
  const m = matchRoute(path);
  const r = role();
  if (m && m.guard) {
    if (m.guard === 'guest' && r !== 'guest') return go(homeFor(me()));
    if (m.guard !== 'guest' && r === 'guest') { return go('#/login?next=' + encodeURIComponent('#' + h)); }
    if (m.guard !== 'guest' && m.guard !== r) {
      // RBAC: a role can only see its own area
      document.title = tr('غير مسموح | UTravel', 'Not allowed | UTravel');
      $('#app').innerHTML = publicLayout(`<div class="wrap sec">${empty('lock', tr('الصفحة دي مش متاحة لحسابك', 'This page isn’t available for your account'), tr('كل نوع حساب ليه لوحة خاصة بيه.', 'Each account type has its own dashboard.'), `<a class="btn btn-primary" href="${homeFor(me())}">${tr('روح للوحة بتاعتك', 'Go to your dashboard')}</a>`)}</div>`);
      return;
    }
  }
  if (path !== LAST_PATH) { UI.mnav = false; UI.side = false; UI.menu = null; UI.filtersOpen = false; closeModal(); if (!path.startsWith('/book')) { if (UI.co && UI.co.done) UI.co = null; } }

  const h1 = $('#app h1'); document.title = (h1 ? h1.textContent.trim().slice(0, 60) + ' | ' : '') + tr('UTravel', 'UTravel');
  if (path !== LAST_PATH) { scrollTo(0, 0); LAST_PATH = path; }

    bootScreen(`<span class="spin" style="color:var(--teal);width:28px;height:28px;margin-top:8px"></span><p class="muted">${tr('جاري تحميل الرحلات…', 'Loading trips…')}</p>`);
    try { await loadCloud(); }
    catch (e) { console.error(e); if (!navigator.onLine) return bootScreen(`<h2 style="font-size:20px">${tr('مفيش اتصال بالإنترنت', 'You’re offline')}</h2><p class="muted">${tr('UTravel محتاج إنترنت علشان يعرض الرحلات المتاحة والأسعار الحالية. اتصل بالإنترنت وحاول تاني.', 'UTravel needs a connection to show current trips and prices. Connect and try again.')}</p><button class="btn btn-primary" onclick="location.reload()">${tr('حاول تاني', 'Try again')}</button>`); return bootScreen(`<h2 style="font-size:20px">${tr('السيرفر مش بيرد دلوقتي', 'The server isn’t responding')}</h2><p class="muted">${esc(cloudMsg(e))}</p><div class="row"><button class="btn btn-primary" onclick="location.reload()">${tr('حاول تاني', 'Try again')}</button><a class="btn btn-ghost" href="?demo=1">${tr('افتح العرض التجريبي', 'Open the offline demo')}</a></div>`); }
    if (RECOVERY_IN_URL && AUTH_UID) { RESET.recovering = AUTH_UID; history.replaceState(null, '', location.pathname + location.search + '#/reset-password'); }
    else if (RECOVERY_ERROR_IN_URL) history.replaceState(null, '', location.pathname + location.search + '#/forgot?expired=1');
  } else { initDB(); if (SESSION && !me()) setSession(null); }
  render();
}
boot();

</script>
</body>
</html>
